<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Behavior Tree Visualizer Logo</title>
  <desc id="desc">A compact behavior tree diagram mark for the NACK and FAND visualizer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#17212b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <path d="M0 420 C150 350 260 455 410 382 C570 304 690 404 960 322 L960 540 L0 540 Z" fill="#0f2d2b" opacity=".72"/>
  <g opacity=".22" stroke="#9ca3af" stroke-width="1">
    <path d="M80 88 H880"/>
    <path d="M80 156 H880"/>
    <path d="M80 224 H880"/>
    <path d="M80 292 H880"/>
    <path d="M80 360 H880"/>
    <path d="M160 54 V470"/>
    <path d="M260 54 V470"/>
    <path d="M360 54 V470"/>
    <path d="M460 54 V470"/>
    <path d="M560 54 V470"/>
    <path d="M660 54 V470"/>
    <path d="M760 54 V470"/>
  </g>
  <g filter="url(#softShadow)">
    <path d="M480 130 V190" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M480 250 V304" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M480 250 C388 260 322 296 280 348" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M480 250 C572 260 638 296 680 348" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="332" y="82" width="296" height="96" rx="18" fill="url(#green)" stroke="#6ee7b7" stroke-width="3"/>
    <rect x="318" y="190" width="324" height="72" rx="16" fill="#1f2937" stroke="#5eead4" stroke-width="3"/>
    <rect x="174" y="346" width="212" height="72" rx="16" fill="#1f2937" stroke="#60a5fa" stroke-width="3"/>
    <rect x="574" y="346" width="212" height="72" rx="16" fill="#1f2937" stroke="#60a5fa" stroke-width="3"/>
    <rect x="380" y="302" width="200" height="62" rx="14" fill="url(#amber)" stroke="#fde68a" stroke-width="3"/>
  </g>
  <text x="480" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#052e2b">ROOT</text>
  <text x="480" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#064e3b">NACK / FAND</text>
  <text x="480" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#d1fae5">SELECTOR</text>
  <text x="480" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#451a03">TASK</text>
  <text x="280" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#dbeafe">CONDITION</text>
  <text x="680" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#dbeafe">ACTION</text>
  <text x="58" y="490" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfeff">BT Visualizer</text>
  <text x="58" y="518" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#a7f3d0">Monster Hunter World AI tools</text>
