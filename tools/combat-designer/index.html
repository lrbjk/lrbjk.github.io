<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat Flow · 战斗行为设计台</title><style>
:root{--bg:#e9e7df;--panel:#faf9f5;--ink:#20231f;--muted:#7c8077;--line:#d7d4ca;--lime:#c8f45f;--coral:#ff745c;--blue:#72a5ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:14px/1.45 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:18px;padding:0 18px;background:#121413;color:white}.brand{display:flex;align-items:center;gap:10px;font-weight:800;min-width:225px}.logo{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--lime);color:#111;font-size:12px}.crumb{color:#92978e;font-size:12px}.crumb b{color:white}.actions{display:flex;align-items:center;gap:8px;margin-left:auto}.saved{color:#aeb4aa;font-size:12px}.saved:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--lime)}.btn{border:1px solid #cfcdc4;background:white;border-radius:7px;padding:8px 11px;font-weight:650;cursor:pointer}.btn.dark{background:#20231f;border-color:#3b3f39;color:white}.btn.go{background:var(--lime);border-color:var(--lime)}.layout{min-height:0;display:grid;grid-template-columns:246px minmax(520px,1fr) 286px}.side,.inspect{min-height:0;overflow:auto;background:var(--panel)}.side{padding:18px 14px;border-right:1px solid var(--line)}.inspect{border-left:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#8c9087}.character{margin:7px 0 20px;font-size:17px}.section{display:flex;justify-content:space-between;margin:18px 5px 8px;font-size:12px}.section button{border:0;background:none;cursor:pointer}.flow{width:100%;display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center;padding:8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}.flow:hover{background:#eeece4}.flow.active{background:#2023 :190px;border:1px solid #c8c5bb;border-radius:10px;background:#faf9f5;box-shadow:0 7px 18px #23262119;cursor:grab;user-select:none;touch-action:none}.node.selected{border-color:#20231f;box-shadow:0 0 0 2px #20231f}.node.running{border-color:var(--lime);box-shadow:0 0 0 3px #c8f45f88}.node-head{display:flex;gap:8px;align-items:center;padding:10px 11px 8px;border-bottom:1px solid #e5e2d9}.type{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:900}.condition .type{background:#dfeaff;color:#2e5da8}.action .type{background:#ffe0d9;color:#a73928}.sequence .type{background:#e6f8bc;color:#45610b}.cooldown .type{background:#fff0ca;color:#8e6510}.node-title b,.node-title small{display:block}.node-title b{font-size:12px}.node-title small{font-size:9px;color:#8b8f86}.node-body{padding:9px 11px 11px;color:#666a62;font-size:10px;min-height:39px}.port{position:absolute;top:32px;width:10px;height:10px;border:2px solid white;border-radius:50%;background:#787c73}.port.in{left:-5px}.port.out{right:-5px;background:var(--coral)}.palette{position:absolute;left:17px;bottom:17px;display:flex;gap:4px;padding:6px;border:1px solid #cfccc2;border-radius:10px;background:#faf9f5ee;box-shadow:0 18px 50px #171a161a}.palette button{padding:8px 10px;border:0;border-radius:7px;background:none;font-size:11px;font-weight:700;cursor:pointer}.palette button:hover{background:#e8e6de}.palette i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px;background:var(--blue)}.palette button:nth-child(2) i{background:var(--coral)}.palette button:nth-child(3) i{background:var(--lime)}.palette button:nth-child(4) i{background:#ffc95c}.hint{position:absolute;right:15px;top:15px;padding:6px 9px;border-radius:6px;background:#faf9f5dd;color:#74786f;font-size:10px}.inspect-head{padding:18px;border-bottom:1px solid var(--line)}.inspect-head h2{margin:5px 0 2px;font-size:16px}.inspect-head p{margin:0;color:var(--muted);font-size:11px}.form{padding:15px 18px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:10px;letter-spacing:.08em;font-weight:800;color:#74786f}.field input,.field textarea,.field select{width:100%;padding:9px 10px;border:1px solid #d2cfc5;border-radius:7px;background:white}.field textarea{min-height:70px;resize:vertical}.params{display:grid;grid-template-columns:1fr 70px;gap:7px}.code{padding:10px;border-radius:8px;background:#20231f;color:#d8dbd3;font:10px/1.6 Consolas,monospace}.danger{width:100%;color:#a43e2e;background:#fff6f4;border-color:#ebc3ba}.modal-bg{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#0f110f85}.modal-bg.show{display:grid}.modal{width:min(470px,calc(100vw - 32px));background:var(--panel);border-radius:13px;overflow:hidden}.modal header{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.modal h3{margin:0}.modal main{padding:18px}.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:#eeece5}.toast{position:fixed;left:50%;bottom:22px;z-index:20;opacity:0;transform:translate(-50%,20px);padding:9px 13px;border-radius:7px;background:#20231f;color:white;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1050px){.layout{grid-template-columns:210px 1fr}.inspect{display:none}}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.brand{min-width:auto}.crumb,.saved{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="logo">CF</span>Combat Flow</div><div class="crumb">项目 / <b>苍烬 · 战斗原型</b> / AI 设计</div><div class="actions"><span class="saved" id="saved">已自动保存</span><button class="btn dark" id="export">导出 JSON</button><button class="btn go" id="play">▶ 运行预览</button></div></header><div class="layout"><aside class="side"><div class="eyebrow">当前角色</div><div class="character"><strong>巡猎者 · Lyra</strong></div><div class="section"><b>逻辑图</b><button>＋</button></div><button class="flow active"><span class="fi">♞</span><span><b>敌人战斗 AI</b><small>行为树 · 7 个节点</small></span><span class="num">01</span></button><button class="flow"><span class="fi">◇</span><span><b>玩家连招逻辑</b><small>技能流 · 6 个节点</small></span><span class="num">02</span></button><button class="flow"><span class="fi">Ⅱ</span><span><b>二阶段切换</b><small>状态机 · 草稿</small></span><span class="num">03</span></button><div class="section"><b>参考素材</b><button id="openUrl">＋</button></div><label class="drop" id="drop"><input id="files" type="file" multiple accept="image/*,video/*"><b>拖入或粘贴图片 / 视频</b><span>也可以点击选择本地文件</span></label><div class="assets" id="assets"><div class="asset"><div class="fallback">◉</div><span>闪避后摇参考 · 00:18</span></div><div class="asset"><div class="fallback">↗</div><span>远程突进节奏</span></div></div></aside><main class="stage"><div class="bar"><div class="tabs"><button class="tab active" data-mode="behavior">行为逻辑</button><button class="tab" data-mode="skill">技能行为</button></div><div class="tools"><button class="btn" id="undo">↶</button><button class="btn" id="fit">⌗</button><button class="btn" id="clear">×</button></div></div><div class="canvas-wrap"><div class="canvas" id="canvas"><svg class="wires" id="wires"/><div id="nodes"></div></div><div class="hint">100% · 拖动节点调整逻辑</div><div class="palette"><button data-add="condition"><i></i>条件</button><button data-add="action"><i></i>动作</button><button data-add="sequence"><i></i>序列</button><button data-add="cooldown"><i></i>冷却</button></div></div></main><aside class="inspect"><div class="inspect-head"><div class="eyebrow">节点检查器</div><h2 id="title"></h2><p id="meta"></p></div><div class="form"><div class="field"><label>显示名称</label><input id="nodeName"></div><div class="field"><label>策划说明</label><textarea id="nodeDesc"></textarea></div><div class="field"><label>参数</label><div class="params"><input value="检测距离"><input value="6.5m"><input value="视野角度"><input value="120°"></div></div><div class="field"><label>运行表达式</label><div class="code" id="code"></div></div><button class="btn danger" id="del">删除这个节点</button></div></aside></div></div><div class="modal-bg" id="modal"><div class="modal"><header><h3>添加参考链接</h3><button class="btn" id="close">×</button></header><main><div class="field"><label>图片或视频 URL</label><input id="url" placeholder="https://example.com/reference.mp4"></div><div class="field"><label>策划备注</label><input id="note" placeholder="例如：参考 00:18 的闪避后摇"></div></main><footer><button class="btn" id="cancel">取消</button><button class="btn go" id="addUrl">添加素材</button></footer></div></div><div class="toast" id="toast"></div>
<script>
const sets={behavior:[{id:1,type:'sequence',x:55,y:195,name:'战斗入口',meta:'ROOT',desc:'持续评估威胁与当前状态'},{id:2,type:'condition',x:285,y:85,name:'判断攻击距离',meta:'COND-02',desc:'距离 ≤ 6.5m 且体力 > 20'},{id:3,type:'condition',x:285,y:285,name:'目标是否可见',meta:'COND-03',desc:'视野 120° · 遮挡检测开启'},{id:4,type:'action',x:520,y:55,name:'三连斩',meta:'SKILL-08',desc:'前摇 0.28s · 可派生追击'},{id:5,type:'cooldown',x:520,y:195,name:'侧向闪避',meta:'CD-04',desc:'冷却 2.4s · 无敌帧 0.18s'},{id:6,type:'action',x:520,y:335,name:'冲刺追踪',meta:'MOVE-02',desc:'最大追踪距离 12m'},{id:7,type:'action',x:750,y:195,name:'重置评估',meta:'LOOP',desc:'等待 0.2s 后返回入口'}],skill:[{id:11,type:'sequence',x:60,y:195,name:'轻攻击输入',meta:'INPUT',desc:'按下攻击键时启动窗口'},{id:12,type:'action',x:300,y:85,name:'第一段 · 横斩',meta:'ATK-01',desc:'伤害 18 · 打断等级 1'},{id:13,type:'condition',x:300,y:285,name:'派生窗口',meta:'WINDOW',desc:'0.34s—0.62s 接受输入'},{id:14,type:'action',x:540,y:85,name:'第二段 · 回旋',meta:'ATK-02',desc:'伤害 24 · 位移 1.2m'},{id:15,type:'action',x:540,y:285,name:'蓄力终结',meta:'ATK-03',desc:'长按 ≥ 0.45s · 伤害 46'},{id:16,type:'cooldown',x:780,y:195,name:'收招恢复',meta:'RECOVER',desc:'恢复控制 0.32s'}]},edges={behavior:[[1,2],[1,3],[2,4],[2,5],[3,6],[4,7],[5,7],[6,7]],skill:[[11,12],[11,13],[12,14],[13,15],[14,16],[15,16]]};let mode='behavior',nodes=structuredClone(sets.behavior),selected=2,timer,history=[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>{let d=document.createElement('div');d.textContent=v;return d.innerHTML},icons={condition:'?',action:'▶',sequence:'⋮',cooldown:'◷'},labels={condition:'条件节点',action:'动作节点',sequence:'序列节点',cooldown:'冷却节点'};
function render(){$('#nodes').innerHTML=nodes.map(n=>`<article class="node ${n.type} ${n.id===selected?'selected':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><i class="port in"></i><div class="node-head"><span class="type">${icons[n.type]}</span><span class="node-title"><b>${esc(n.name)}</b><small>${n.meta}</small></span></div><div class="node-body">${esc(n.desc)}</div><i class="port out"></i></article>`).join('');bind();requestAnimationFrame(draw);inspect();save()}function draw(){let r=$('#canvas').getBoundingClientRect(),hot=$('.node.running')?.dataset.id;$('#wires').setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);$('#wires').innerHTML=edges[mode].map(([a,b])=>{let n=nodes.find(x=>x.id===a),m=nodes.find(x=>x.id===b);if(!n||!m)return'';let x=n.x+190,y=n.y+32,x2=m.x,y2=m.y+32,c=Math.max(50,(x2-x)/2);return`<path class="wire ${String(b)===hot?'hot':''}" d="M${x} ${y}C${x+c} ${y} ${x2-c} ${y2} ${x2} ${y2}"/>`}).join('')}function bind(){$$('.node').forEach(el=>el.onpointerdown=e=>{if(timer)return;e.preventDefault();selected=+el.dataset.id;$$('.node').forEach(x=>x.classList.toggle('selected',x===el));inspect();let n=nodes.find(x=>x.id===selected),s=[e.clientX,e.clientY,n.x,n.y],before=JSON.stringify(nodes);el.setPointerCapture(e.pointerId);el.onpointermove=v=>{n.x=Math.max(5,s[2]+v.clientX-s[0]);n.y=Math.max(5,s[3]+v.clientY-s[1]);el.style.left=n.x+'px';el.style.top=n.y+'px';draw()};let finish=()=>{el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;history.push(before);if(history.length>20)history.shift();save()};el.onpointerup=finish;el.onpointercancel=finish})}function inspect(){let n=nodes.find(x=>x.id===selected);if(!n)return;$('#title').textContent=n.name;$('#meta').textContent=labels[n.type]+' · '+n.meta;$('#nodeName').value=n.name;$('#nodeDesc').value=n.desc;$('#code').innerHTML=n.type==='condition'?'distance(target) &lt;= 6.5<br>&amp;&amp; stamina &gt; 20':`execute("${n.meta.toLowerCase()}")<br>await completion`}function save(){localStorage.setItem('combat-'+mode,JSON.stringify(nodes));$('#saved').textContent='正在保存…';clearTimeout(save.t);save.t=setTimeout(()=>$('#saved').textContent='已自动保存',400)}function snap(){history.push(JSON.stringify(nodes));if(history.length>20)history.shift()}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}function stop(){clearInterval(timer);timer=null;$$('.node').forEach(n=>n.classList.remove('running'));$('#play').textContent='▶ 运行预览';draw()}
$$('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;nodes=structuredClone(sets[mode]);selected=nodes[0].id;$$('.tab').forEach(x=>x.classList.toggle('active',x===t));stop();render();toast('已切换到'+t.textContent)});$$('.palette button').forEach(b=>b.onclick=()=>{snap();let t=b.dataset.add,id=Date.now(),m={condition:['新判断条件','满足条件时继续'],action:['新动作','配置动画、位移与伤害'],sequence:['新序列','顺序执行子节点'],cooldown:['冷却控制','等待冷却完成']}[t];nodes.push({id,type:t,x:150+nodes.length*20,y:120+nodes.length*18,name:m[0],meta:t.toUpperCase()+'-'+(nodes.length+1),desc:m[1]});selected=id;render();toast('已添加节点')});$('#nodeName').oninput=e=>{let n=nodes.find(x=>x.id===selected);if(n){n.name=e.target.value;render()}};$('#nodeDesc').oninput=e=>{let n=nodes.find(x=>x.id===selected);if(n){n.desc=e.target.value;render()}};$('#del').onclick=()=>{snap();nodes=nodes.filter(n=>n.id!==selected);selected=nodes[0]?.id;render();toast('节点已删除')};$('#clear').onclick=()=>{selected=null;render()};$('#fit').onclick=()=>toast('画布已适配当前窗口');$('#undo').onclick=()=>{if(!history.length)return toast('没有可撤销的操作');nodes=JSON.parse(history.pop());selected=nodes[0]?.id;render()};$('#play').onclick=()=>{if(timer)return stop();let order=nodes.map(n=>n.id),i=0;$('#play').textContent='■ 停止预览';let step=()=>{$$('.node').forEach(n=>n.classList.toggle('running',+n.dataset.id===order[i]));draw();i=(i+1)%order.length};step();timer=setInterval(step,750)};$('#export').onclick=()=>{let a=document.createElement('a'),data={project:'苍烬 · 战斗原型',flow:mode,nodes,connections:edges[mode],exportedAt:new Date().toISOString()};a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='combat-flow-'+mode+'.json';a.click();toast('设计数据已导出')};$$('.flow').forEach(b=>b.onclick=()=>{$$('.flow').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('已打开「'+b.querySelector('b').textContent+'」')});
function addAsset(f,src){let video=f.type?.startsWith('video')||/\.(mp4|webm|mov)(\?|$)/i.test(src),e=document.createElement('div');e.className='asset';e.innerHTML=video?`<video src="${src}" muted loop></video><span>${esc(f.name||'视频参考')}</span>`:`<img src="${src}" alt=""><span>${esc(f.name||'图片参考')}</span>`;e.onclick=()=>{let v=e.querySelector('video');if(v)v.paused?v.play():v.pause()};$('#assets').prepend(e)}function load(fs){[...fs].filter(f=>f.type.startsWith('image')||f.type.startsWith('video')).forEach(f=>addAsset(f,URL.createObjectURL(f)));toast('参考素材已加入')}$('#files').onchange=e=>load(e.target.files);['dragenter','dragover'].forEach(n=>$('#drop').addEventListener(n,e=>{e.preventDefault();$('#drop').classList.add('drag')}));['dragleave','drop'].forEach(n=>$('#drop').addEventListener(n,e=>{e.preventDefault();$('#drop').classList.remove('drag')}));$('#drop').ondrop=e=>load(e.dataTransfer.files);document.onpaste=e=>{let fs=[...e.clipboardData.files];if(fs.length)load(fs)};$('#openUrl').onclick=()=>$('#modal').classList.add('show');$('#close').onclick=$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#addUrl').onclick=()=>{let src=$('#url').value.trim();if(!src)return toast('请先填写素材链接');addAsset({name:$('#note').value||'链接参考',type:''},src);$('#modal').classList.remove('show');toast('参考链接已添加')};window.onresize=draw;let saved=localStorage.getItem('combat-'+mode);if(saved)try{nodes=JSON.parse(saved)}catch{}render();
</script><script src="./app-v2.js?v=3"></script></body></html>
